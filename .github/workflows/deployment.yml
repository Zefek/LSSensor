name: Deploy Arduino LS Sensor on Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - Home
      serial_port:
        required: false
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  deployment:
    uses: Zefek/GithubActions/.github/workflows/arduino-build-deploy.yml@ae91973aabd2adaf18a83e820847f5bc02b7251f
    with:
      environment: ${{ inputs.environment }}
      serial_port: ${{ inputs.serial_port }}
      device_name: LSSensorArduino
      source_dir: "./src/Arduino"

