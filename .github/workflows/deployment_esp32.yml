name: Deploy LS Sensor ESP32 on Environment

on:
  workflow_dispatch:
    inputs:
      serial_port:
        required: false
        type: string
      environment:
        required: true
        type: choice
        options:
          - Home

permissions:
  contents: read
  deployments: write

jobs:
  deployment:
    uses: Zefek/GithubActions/.github/workflows/arduino-build-deploy.yml@2e184d778e792c3032f18b9b11d414ae3528ac7c
    with:
      environment: ${{ inputs.environment }}
      serial_port: ${{ inputs.serial_port }}
      device_name: LSSensorESP32
      source_dir:  "./src/ESP32"
      ota:         true
